name: HSE real Windows GUI encoded hard-subtitle OCR acceptance

on:
  push:

permissions:
  contents: read

concurrency:
  group: hse-real-gui-hard-ocr
  cancel-in-progress: false

jobs:
  real-tk-hard-ocr:
    if: contains(github.event.head_commit.message, '[hse-real-gui-hard-ocr]')
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create disposable actual OCR and Tk source environment
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 required'
          }
          $scratch = Join-Path $env:RUNNER_TEMP "hse-gui-hard-ocr-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $scratch) { throw 'Existing disposable study path collision' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          python -m venv (Join-Path $scratch 'venv')
          if ($LASTEXITCODE -ne 0) { throw 'OCR GUI isolated venv unavailable' }
          (Resolve-Path (Join-Path $scratch 'venv\Scripts')).Path |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "HSE_GUI_HARD_OCR_SCRATCH=$scratch" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install exact HSE declared OCR runtime only inside test venv
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[ocr]" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Actual RapidOCR CPU runtime dependency unavailable' }
      - name: Local streaming parity and direct GUI/CLI safety contracts
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # No entire-release regression here: keep this a targeted
          # single-feature integration gate. A full build is for promotion.
          foreach ($pattern in @(
            'test_streaming_public_ocr.py',
            'test_early_output_collision.py',
            'test_gui_local_input.py',
            'test_local_sidecar_routing.py',
            'test_caption_islands.py',
            'test_gui_local_ocr_preview.py',
            'test_local_batch.py'
          )) {
            python -B -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "local OCR streaming contract failure: $pattern" }
          }
          # Exercise actual ttk widget state after headless contracts,
          # before expensive FFmpeg/model download on a failing branch.
          python -B tools/hse_gui_tk_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'real Tk selector/mode smoke failed' }
      - name: Prepare independently SHA-pinned FFmpeg and FFprobe
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg toolchain unavailable' }
      - name: Verify pins and prepare the shared Japanese/Chinese PP-OCR recognition assets
        shell: pwsh
        run: |
          if (-not $env:HSE_GUI_HARD_OCR_SCRATCH) { throw 'Missing isolated study root' }
          $models = Join-Path $env:HSE_GUI_HARD_OCR_SCRATCH 'models'
          python -B tools/prepare_models.py --out $models --languages zh --prefer-mirrors --timeout-seconds 22 --attempts 1 *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Japanese/Chinese OCR models invalid or unavailable' }
      - name: Real Tk GUI Japanese/Chinese actual visual OCR and no-caption control
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $models = Join-Path $env:HSE_GUI_HARD_OCR_SCRATCH 'models'
          # Reuse the SAME 2 source MP4s under default and optional filter;
          # compare actual JA/ZH PP-OCR, full Tk Start/worker/export and
          # blank-clip negative control. No model or video upload.
          python -B tools/verify_real_gui_hard_ocr.py --model-dir $models --languages ja,zh --compare-caption-islands
          if ($LASTEXITCODE -ne 0) { throw 'Real Tk GUI hard OCR and optional island comparison failed' }
      - name: Delete only isolated runtime and downloaded model files
        if: always()
        shell: pwsh
        run: |
          if ($env:HSE_GUI_HARD_OCR_SCRATCH -and
              $env:HSE_GUI_HARD_OCR_SCRATCH.StartsWith($env:RUNNER_TEMP)) {
            Remove-Item -LiteralPath $env:HSE_GUI_HARD_OCR_SCRATCH -Recurse -Force -ErrorAction SilentlyContinue
          }
