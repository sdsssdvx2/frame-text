name: HSE upper-line recognizer-only differential research

on:
  push:

permissions:
  contents: read

concurrency:
  group: hse-rec-only-uppers-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  independent-crop-ab:
    if: ${{ contains(github.event.head_commit.message, '[hse-upper-row-recognition]') }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated OCR research Python
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 PP-OCRv5 required'
          }
          if (Test-Path .venv-hse-upper-crop) { throw 'test path already exists' }
          python -m venv .venv-hse-upper-crop
          if ($LASTEXITCODE -ne 0) { throw 'isolated Python environment failed' }
          (Resolve-Path .venv-hse-upper-crop\Scripts).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install OCR dependencies and verify no-oracle safety
        shell: pwsh
        run: |
          python -m pip install -e ".[ocr]"
          if ($LASTEXITCODE -ne 0) { throw 'required OCR runtime unavailable' }
          python -B -m unittest discover -s tests -p test_upper_row_rec_only_research.py -v
          if ($LASTEXITCODE -ne 0) { throw 'no-oracle crop regression failed' }
          python -B -m unittest discover -s tests -p test_raw_multiline_model_filter.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OCR geometry/filter regression failed' }
      - name: Prepare verified LGPL FFmpeg binaries
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg verification failed' }
      - name: Compare V5 candidate and independently pinned V6 verifier on moving JA/ZH and blank controls
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "hse-upper-crop-$env:GITHUB_RUN_ID"
          if (Test-Path $scratch) { throw 'scratch collision' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            $models = Join-Path $scratch 'models'
            python -B tools/prepare_models.py --languages ko,en,zh --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw 'SHA-pinned real OCR models unavailable' }
            python -B tools/compare_upper_row_rec_only.py --model-dir $models --cross-model
            if ($LASTEXITCODE -ne 0) { throw 'rec-only study did not finish' }
          }
          finally {
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Delete temporary Python runtime
        if: ${{ always() }}
        shell: pwsh
        run: |
          Remove-Item .venv-hse-upper-crop -Recurse -Force -ErrorAction SilentlyContinue
