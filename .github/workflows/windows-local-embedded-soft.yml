name: HSE Windows real embedded text subtitle acceptance

on:
  push:

permissions:
  contents: read

jobs:
  local-soft:
    if: ${{ contains(github.event.head_commit.message, '[hse-local-soft-e2e]') }}
    runs-on: windows-2025
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated temporary environment
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Windows x64 required"
          }
          python -m venv .venv-local-soft
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          (Resolve-Path .venv-local-soft\Scripts).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install production dependencies without OCR or packaging
        shell: pwsh
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw 'local-soft test dependency setup failed' }
      - name: Prepare SHA-pinned FFmpeg and FFprobe
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'verified FFmpeg unavailable' }
      - name: Verify subtitle sidecar integrity and GUI/CLI subtitle-first routing
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -B -m unittest discover -s tests -p 'test_local_sidecar*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'local sidecar integrity tests failed' }
          python -B -m unittest discover -s tests -p 'test_gui_local_input.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'local GUI regression failed' }
          python -B -m unittest discover -s tests -p 'test_cli_local_soft_first.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'local CLI regression failed' }
          foreach ($pattern in @(
            'test_local_bitmap_bdn_ocr.py',
            'test_local_image_subtitles.py',
            'test_native_vsf_timing.py',
            'test_cli_native_vsf.py'
          )) {
            python -B -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "bitmap subtitle contract rejected: $pattern" }
          }
      - name: Real local MKV embedded subtitles, language routing, safe outputs
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -B tools/verify_local_embedded_video.py
          if ($LASTEXITCODE -ne 0) { throw 'local video embedded-subtitle end-to-end acceptance failed' }
