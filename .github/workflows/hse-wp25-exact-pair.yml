name: HSE WP25 exact publisher burned-clean pair natural OCR (research HOLD)

on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107

permissions:
  contents: read

concurrency:
  group: hse-wp25-exact-pair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  wp25-exact-pair:
    if: ${{ contains(github.event.head_commit.message, '[hse-wp25-exact-pair]') || contains(github.event.head_commit.message, '[hse-wp25-scope-audit]') || contains(github.event.head_commit.message, '[hse-wp25-caption-probe]') || contains(github.event.head_commit.message, '[hse-wp25-quality-review]') }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run publisher burned-clean pair with separately published SRT
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
          HSE_WP25_SCOPE_ONLY: ${{ contains(github.event.head_commit.message, '[hse-wp25-scope-audit]') }}
          HSE_WP25_CAPTION_PROBE: ${{ contains(github.event.head_commit.message, '[hse-wp25-caption-probe]') }}
          HSE_WP25_QUALITY_REVIEW: ${{ contains(github.event.head_commit.message, '[hse-wp25-quality-review]') }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 natural OCR benchmark only'
          }
          $root=Join-Path $env:RUNNER_TEMP "hse-wp25-pair-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $root) { throw 'owned scratch collision' }
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $venv=Join-Path $root 'venv'
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'isolated Python failed' }
            $py=Join-Path $venv 'Scripts\python.exe'
            & $py -m pip install --disable-pip-version-check -e '.[ocr]' *> $null
            if ($LASTEXITCODE -ne 0) { throw 'declared free OCR runtime unavailable' }
            $bin=Join-Path $root 'bin'
            pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1 -Destination $bin *> $null
            if ($LASTEXITCODE -ne 0) { throw 'pinned LGPL FFmpeg unavailable' }
            $env:HSE_FFMPEG=Join-Path $bin 'ffmpeg.exe'
            $env:HSE_FFPROBE=Join-Path $bin 'ffprobe.exe'
            if ($env:HSE_WP25_SCOPE_ONLY -eq 'true') {
              & $py -B tools/audit_wp25_visual_reference_scope.py --scratch (Join-Path $root 'scope') --approve-public-sources
              if ($LASTEXITCODE -ne 0) { throw 'WP25 visual-reference scope audit incomplete; no retry' }
              Write-Host 'HSE_WP25_SCOPE_AUDIT=MEASURED;OCR_CALLS=0;PRODUCTION_DEFAULT_UNCHANGED=YES;RELEASE=HOLD'
              return
            }
            $models=Join-Path $root 'models'
            & $py -B tools/prepare_models.py --languages en --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw 'SHA-pinned English OCR model unavailable' }
            $probeFlags = @()
            if ($env:HSE_WP25_CAPTION_PROBE -eq 'true') {
              $probeFlags = @('--production-caption-probe')
            }
            if ($env:HSE_WP25_QUALITY_REVIEW -eq 'true') {
              if ($probeFlags.Count -ne 0) { throw 'select one WP25 probe mode' }
              $probeFlags = @('--production-quality-review')
            }
            & $py -B tools/verify_wp25_exact_pair_ocr.py --scratch (Join-Path $root 'media') --model-dir $models --manifest (Join-Path $env:GITHUB_WORKSPACE 'models/manifest.json') --approve-public-sources @probeFlags
            if ($LASTEXITCODE -ne 0) { throw 'WP25 bounded OCR study incomplete; no retry' }
            if ($env:HSE_WP25_CAPTION_PROBE -eq 'true') {
              Write-Host 'HSE_WP25_CAPTION_PROBE=MEASURED;CLEAN_OCR=NO;CANDIDATE_OCR=NO;RELEASE=HOLD'
              return
            }
            if ($env:HSE_WP25_QUALITY_REVIEW -eq 'true') {
              Write-Host 'HSE_WP25_QUALITY_REVIEW=MEASURED;PRODUCT_SRT_REWRITTEN=NO;PRIVATE_REVIEW_LOCAL_ONLY=YES;RELEASE=HOLD'
              return
            }
            Write-Host 'HSE_WP25_EXACT_PAIR=MEASURED;PRODUCTION_DEFAULT_UNCHANGED=YES;RELEASE=HOLD'
          }
          finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
