name: HSE PP-OCRv6-medium JA/ZH recognition quality (research HOLD)

on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107

permissions:
  contents: read

concurrency:
  group: hse-v6-medium-${{ github.sha }}
  cancel-in-progress: false

jobs:
  v6-medium:
    if: ${{ contains(github.event.head_commit.message, '[hse-v6-medium-cjk]') }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare one exact official V6-medium recognizer on pinned CJK truth
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 only'
          }
          $root=Join-Path $env:RUNNER_TEMP "hse-v6-medium-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $root) { throw 'owned scratch collision' }
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $venv=Join-Path $root 'venv'
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'isolated Python failed' }
            $py=Join-Path $venv 'Scripts\python.exe'
            & $py -m pip install --disable-pip-version-check -e '.[ocr]' *> $null
            if ($LASTEXITCODE -ne 0) { throw 'pinned HSE OCR runtime unavailable' }
            $models=Join-Path $root 'models'
            & $py -B tools/prepare_models.py --languages zh --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw 'pinned V5 reference models unavailable' }
            & $py -B tools/compare_cjk_v6_medium.py --model-dir $models --manifest (Join-Path $env:GITHUB_WORKSPACE 'models/manifest.json') --scratch (Join-Path $root 'v6-medium') --approve-cc-dataset-download
            if ($LASTEXITCODE -ne 0) { throw 'V6 medium CJK comparison incomplete; no retry' }
            Write-Host 'HSE_V6_MEDIUM_CJK=MEASURED;PRODUCT_DEFAULT_UNCHANGED=YES;RELEASE=HOLD'
          }
          finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
