name: HSE true streaming two-line OCR fidelity experiment

on:
  push:

permissions:
  contents: read

concurrency:
  group: hse-real-two-line-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-multiline:
    if: ${{ contains(github.event.head_commit.message, '[hse-animated-multiline]') || contains(github.event.head_commit.message, '[hse-two-line-timing-diagnostic]') }}
    runs-on: windows-2025
    env:
      HSE_TIMING_ONLY: ${{ contains(github.event.head_commit.message, '[hse-two-line-timing-diagnostic]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make isolated Windows test environment
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "four-language model study requires Windows x64"
          }
          python -m venv .venv-hse-multiline
          if ($LASTEXITCODE -ne 0) { throw "isolated Python environment unavailable" }
          (Resolve-Path .venv-hse-multiline\Scripts).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install OCR dependencies and verify fail-closed report
        shell: pwsh
        run: |
          python -m pip install -e ".[ocr]"
          if ($LASTEXITCODE -ne 0) { throw "genuine OCR dependencies unavailable" }
          python -B -m unittest discover -s tests -p test_multiline_streaming_quality_report.py -v
          if ($LASTEXITCODE -ne 0) { throw "two-line scoring regressions failed" }
          python -B -m unittest discover -s tests -p test_rapidocr_subtitle_filter.py -v
          if ($LASTEXITCODE -ne 0) { throw "subtitle filter regression" }
      - name: Prepare pinned FFmpeg video decoder and encoder
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw "verified FFmpeg setup failed" }
      - name: Decode and process genuine moving two-line MP4 through full production pipeline
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP "hse-two-line-$env:GITHUB_RUN_ID"
          if (Test-Path $sandbox) { throw "isolated test directory unexpectedly exists" }
          New-Item -ItemType Directory -Path $sandbox | Out-Null
          try {
            $models = Join-Path $sandbox "models"
            python -B tools/prepare_models.py --languages ko,en,zh --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw "pinned PP-OCRv5 models unavailable" }
            $studyArgs = @('--model-dir', $models)
            if ($env:HSE_TIMING_ONLY -eq 'true') {
              $studyArgs += @('--languages', 'ja,zh')
            }
            python -B tools/verify_multiline_streaming_ocr_quality.py @studyArgs
            if ($LASTEXITCODE -ne 0) { throw "real video streaming OCR study was incomplete" }
          }
          finally {
            Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove temporary Python environment
        if: ${{ always() }}
        shell: pwsh
        run: |
          Remove-Item .venv-hse-multiline -Recurse -Force -ErrorAction SilentlyContinue
