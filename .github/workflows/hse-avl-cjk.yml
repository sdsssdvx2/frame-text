name: HSE compare AVL subtitle OCR core on pinned CJK truth (research HOLD)

on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107

permissions:
  contents: read

concurrency:
  group: hse-avl-cjk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  avl-cjk:
    if: ${{ contains(github.event.head_commit.message, '[hse-avl-cjk]') }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare pinned Apache AVL core without replacing HSE runtime
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 only'
          }
          $root=Join-Path $env:RUNNER_TEMP "hse-avl-cjk-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $root) { throw 'owned scratch collision' }
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $venv=Join-Path $root 'venv'
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'isolated Python failed' }
            $py=Join-Path $venv 'Scripts\python.exe'
            & $py -m pip install --disable-pip-version-check -e '.[ocr]' *> $null
            if ($LASTEXITCODE -ne 0) { throw 'HSE OCR runtime unavailable' }
            & $py -m pip install --disable-pip-version-check 'pyclipper==1.4.0' 'shapely==2.1.2' *> $null
            if ($LASTEXITCODE -ne 0) { throw 'AVL detector geometry dependencies unavailable' }
            $avl=Join-Path $root 'AVL-SubtitleOCR'
            git clone --quiet --filter=blob:none --no-checkout https://github.com/allvoicelab/AVL-SubtitleOCR.git $avl
            if ($LASTEXITCODE -ne 0) { throw 'pinned AVL repository clone unavailable' }
            git -C $avl config core.autocrlf false
            if ($LASTEXITCODE -ne 0) { throw 'failed to freeze AVL checkout line endings' }
            git -C $avl checkout --quiet --detach ee0269df692719b658ccae0e75106e9b84af40ec
            if ($LASTEXITCODE -ne 0) { throw 'pinned AVL commit checkout unavailable' }
            $avlHead=(git -C $avl rev-parse HEAD).Trim()
            if ($avlHead -ne 'ee0269df692719b658ccae0e75106e9b84af40ec') { throw 'AVL commit pin mismatch' }
            & $py -m pip install --disable-pip-version-check --no-deps -e (Join-Path $avl 'avl-open') *> $null
            if ($LASTEXITCODE -ne 0) { throw 'pinned AVL Apache core editable install unavailable' }
            $models=Join-Path $root 'hse-models'
            & $py -B tools/prepare_models.py --languages zh --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw 'HSE pinned CJK model unavailable' }
            & $py -B tools/compare_avl_cjk_core.py --model-dir $models --manifest (Join-Path $env:GITHUB_WORKSPACE 'models/manifest.json') --approve-cc-dataset-download
            if ($LASTEXITCODE -ne 0) { throw 'AVL/HSE same-frame CJK comparison incomplete; no retry' }
            Write-Host 'HSE_AVL_CJK=MEASURED;PRODUCT_UNCHANGED=YES;RELEASE=HOLD'
          }
          finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
