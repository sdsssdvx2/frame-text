name: HSE genuine Japanese film temporal watermark research (HOLD)
on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107
permissions:
  contents: read
concurrency:
  group: hse-natural-ja-temporal-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-ja-temporal:
    if: ${{ contains(github.event.head_commit.message, '[hse-real-ja-temporal]') }}
    runs-on: windows-2025
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PP-OCRv5 real Japanese film with synthetic known logo and in-memory temporal variants
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Windows x64 required' }
          $scratch=Join-Path $env:RUNNER_TEMP "hse-ja-temporal-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $scratch) { throw 'scratch collision' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            python -m venv (Join-Path $scratch 'venv')
            if ($LASTEXITCODE -ne 0) { throw 'isolated Python unavailable' }
            $py=Join-Path $scratch 'venv\Scripts\python.exe'
            $env:PYTHONPATH="$env:GITHUB_WORKSPACE\src;$env:GITHUB_WORKSPACE\tools"
            $env:TMP=$scratch; $env:TEMP=$scratch
            & $py -m pip install --disable-pip-version-check -e '.[ocr]' *> $null
            if ($LASTEXITCODE -ne 0) { throw 'free local OCR package unavailable' }
            & $py -B tools/verify_commons_temporal_japanese.py --self-test
            if ($LASTEXITCODE -ne 0) { throw 'timed candidate removal invariant failed' }
            pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1 *> $null
            if ($LASTEXITCODE -ne 0) { throw 'verified LGPL FFmpeg unavailable' }
            $models=Join-Path $scratch 'models'
            & $py -B tools/prepare_models.py --languages zh --out $models --prefer-mirrors --timeout-seconds 22 --attempts 1 *> $null
            if ($LASTEXITCODE -ne 0) { throw 'pinned local CJK model unavailable' }
            & $py -B tools/verify_commons_temporal_japanese.py --accept-public-download --model-dir $models --manifest models/manifest.json
            if ($LASTEXITCODE -ne 0) { throw 'actual Japanese temporal evidence missing' }
            Write-Host 'HSE_REAL_JA_TEMPORAL=MEASURED;IN_MEMORY_ONLY=YES;RELEASE=HOLD;OPERATING_UNCHANGED=YES'
          }
          finally {
            if (Test-Path -LiteralPath $scratch) {
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
