name: HSE isolated timed OCR streaming and long-episode contract

on:
  push:

permissions:
  contents: read

concurrency:
  group: hse-timed-ocr-contract-${{ github.sha }}
  cancel-in-progress: false

jobs:
  streaming-core:
    if: ${{ contains(github.event.head_commit.message, '[hse-timed-ocr-contract]') }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare an isolated Python environment in runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 only'
          }
          if (-not $env:RUNNER_TEMP -or -not $env:GITHUB_RUN_ID) {
            throw 'Required isolated runner temp unavailable'
          }
          $root = Join-Path $env:RUNNER_TEMP ("hse-timed-integrated-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) {
            throw 'Existing isolated runtime cannot be overwritten'
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          python -m venv (Join-Path $root 'venv')
          if ($LASTEXITCODE -ne 0) { throw 'venv create failed' }
          $py = Join-Path $root 'venv/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $py)) { throw 'isolated interpreter missing' }
          "HSE_TIMED_INTEGRATED_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HSE_TIMED_INTEGRATED_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare SHA-pinned LGPL FFmpeg BEFORE running media tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:HSE_TIMED_INTEGRATED_ROOT) { throw 'missing isolated root' }
          $dst = Join-Path $env:HSE_TIMED_INTEGRATED_ROOT 'ffmpeg'
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1 -Destination $dst
          if ($LASTEXITCODE -ne 0) { throw 'pinned FFmpeg not available' }
          $ffmpeg = Join-Path $dst 'ffmpeg.exe'
          $ffprobe = Join-Path $dst 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffmpeg) -or -not (Test-Path -LiteralPath $ffprobe)) {
            throw 'verified FFmpeg or FFprobe absent'
          }
          "HSE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HSE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run one bounded integration suite on actual current commit
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $py = $env:HSE_TIMED_INTEGRATED_PY
          if (-not $py -or -not $env:HSE_FFMPEG -or -not $env:HSE_FFPROBE) {
            throw 'verified integrated dependencies missing'
          }
          if (-not (Test-Path -LiteralPath $env:HSE_FFMPEG) -or -not (Test-Path -LiteralPath $env:HSE_FFPROBE)) {
            throw 'cannot run FFmpeg tests as skipped'
          }
          & $py -m pip install --disable-pip-version-check "numpy>=2,<3" "opencv-python-headless>=4.10" "Pillow>=10" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'temporary free test dependencies unavailable' }
          foreach ($pattern in @(
            'test_timed_ocr_streaming.py',
            'test_native_vsf_timing.py',
            'test_cli_native_vsf.py',
            'test_local_batch.py',
            'test_gui_frame_review.py',
            'test_subtitle_review_pack.py',
            'test_temporal_review_gui.py',
            'test_local_batch_gui.py'
          )) {
            & $py -B -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "Integrated research regression failed: $pattern" }
          }
          & $py -B tools/verify_timed_ocr_seek_real.py
          if ($LASTEXITCODE -ne 0) { throw 'actual FFmpeg full-versus-seek sample verification failed' }
          Write-Host "HSE_TIMED_INTEGRATED=PASS;REAL_FFMPEG_BEFORE_TESTS=YES;MODEL_CALLS=0;USER_MEDIA=NO;OPERATING_FILES=UNCHANGED"
      - name: Clean only this run's isolated scratch environment
        if: always()
        shell: pwsh
        run: |
          if ($env:HSE_TIMED_INTEGRATED_ROOT -and $env:RUNNER_TEMP) {
            $root = [System.IO.Path]::GetFullPath($env:HSE_TIMED_INTEGRATED_ROOT)
            $temp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
            if ($root.StartsWith($temp + [System.IO.Path]::DirectorySeparatorChar) -and
                (Split-Path $root -Leaf) -like "hse-timed-integrated-*") {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
