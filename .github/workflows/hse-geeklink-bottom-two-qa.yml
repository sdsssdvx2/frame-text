name: HSE four-language coherent caption islands vs existing OCR (research HOLD)
on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107

permissions:
  contents: read
  statuses: write

jobs:
  geeklink-image-qa:
    if: ${{ contains(github.event.head_commit.message, '[hse-caption-islands-quality]') }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned CC0 and attributed CC-BY-SA film-image benchmark, no credentials
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "hse-public-film-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $root) { throw 'benchmark scratch path collision' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:GIT_TERMINAL_PROMPT = '0'
          git -C $root init -q
          if ($LASTEXITCODE -ne 0) { throw 'unable to create pinned-data checkout' }
          git -C $root remote add origin https://github.com/GeekLinkDev/geeklink-ocr-benchmark.git
          if ($LASTEXITCODE -ne 0) { throw 'unable to locate public benchmark' }
          git -C $root -c credential.helper= fetch --depth=1 --no-tags origin baa9ccbb7ffad36d56cc0ea115256a09bdf427f4
          if ($LASTEXITCODE -ne 0) { throw 'pinned public benchmark unavailable' }
          git -C $root checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'pinned benchmark checkout failed' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne 'baa9ccbb7ffad36d56cc0ea115256a09bdf427f4') { throw 'unexpected public dataset commit' }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'LICENSE-DATA'))) { throw 'public dataset license missing' }
          'HSE_PUBLIC_BENCH_PIN=PASS; LICENSE=REVIEWED_MIXED; NO_MEDIA_REDISTRIBUTION=TRUE'
      - name: Isolate verified source OCR models and compare fixed stratified samples
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "hse-geeklink-runtime-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $scratch) { throw 'benchmark virtual environment collision' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $venv = Join-Path $scratch 'venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'isolated runtime creation failed' }
          $py = Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check -e ".[ocr]" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'isolated OCR dependencies unavailable' }
          $models = Join-Path $scratch 'models'
          & $py -B tools/prepare_models.py --languages ko,en,zh --out $models *> $null
          if ($LASTEXITCODE -ne 0) { throw 'SHA-pinned four-language models unavailable' }
          $dataset = Join-Path $env:RUNNER_TEMP "hse-public-film-$env:GITHUB_RUN_ID"
          & $py -B -m unittest discover -s tests -p test_caption_islands.py -v
          if ($LASTEXITCODE -ne 0) { throw 'coherent-caption geometry contracts failed' }
          & $py -B tools/benchmark_geeklink_open_images.py --dataset $dataset --model-dir $models --all-available --research-last-two-lines --research-caption-islands
          if ($LASTEXITCODE -ne 0) { throw 'public source OCR generalization study failed' }
      - name: Remove temporary film frames, models and isolated venv
        if: ${{ always() }}
        shell: pwsh
        run: |
          $dataset = Join-Path $env:RUNNER_TEMP "hse-public-film-$env:GITHUB_RUN_ID"
          $scratch = Join-Path $env:RUNNER_TEMP "hse-geeklink-runtime-$env:GITHUB_RUN_ID"
          Remove-Item -LiteralPath $dataset -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
      - name: Publish research execution status (never a production-approval status)
        if: ${{ always() }}
        shell: pwsh
        env:
          HSE_GITHUB_STATUS_TOKEN: ${{ github.token }}
          HSE_RESEARCH_JOB_STATE: ${{ job.status }}
        run: |
          $state = if ($env:HSE_RESEARCH_JOB_STATE -eq 'success') { 'success' } elseif ($env:HSE_RESEARCH_JOB_STATE -eq 'failure') { 'failure' } else { 'error' }
          $desc = if ($state -eq 'success') { 'Four-language coherent-caption comparison executed; production NOT approved' } else { 'Four-language coherent-caption comparison did not complete; NOT approved' }
          $data = @{
            state = $state
            context = 'hse/research-four-language-caption-islands'
            description = $desc
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{
              Authorization = "Bearer $env:HSE_GITHUB_STATUS_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } -ContentType 'application/json' -Body $data -TimeoutSec 15 | Out-Null
            Write-Host "HSE_RESEARCH_ISLANDS_STATUS=$state;RELEASE_AUTHORIZED=NO"
          }
          catch {
            Write-Host ('HSE_RESEARCH_ISLANDS_STATUS=UNPUBLISHED;ERROR_CLASS=' + $_.Exception.GetType().Name)
          }
