name: HSE same-video quiet-segment-cap OCR timing research

on:
  push:

permissions:
  contents: read

concurrency:
  group: hse-quiet-cap-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-quiet-cap:
    if: ${{ contains(github.event.head_commit.message, '[hse-quiet-cap-qa]') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated Windows OCR runtime
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'pinned Windows x64 runtime required'
          }
          if (Test-Path .venv-hse-quiet-cap) { throw 'isolated runtime path already exists' }
          python -m venv .venv-hse-quiet-cap
          if ($LASTEXITCODE -ne 0) { throw 'isolated runtime unavailable' }
          (Resolve-Path .venv-hse-quiet-cap\Scripts).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install real PP-OCRv5 and prove bounded detector contracts
        shell: pwsh
        run: |
          python -m pip install -e ".[ocr]"
          if ($LASTEXITCODE -ne 0) { throw 'pinned OCR library setup failed' }
          foreach ($file in @('test_detector_sampling.py','test_quiet_cap_trial_report.py','test_multiline_streaming_quality_report.py','test_rapidocr_subtitle_filter.py')) {
            python -B -m unittest discover -s tests -p $file -v
            if ($LASTEXITCODE -ne 0) { throw "quiet cap fail-closed regression: $file" }
          }
      - name: Verify source video codec
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'verified LGPL FFmpeg unavailable' }
      - name: Compare baseline versus 0.625 and 0.75 second caps plus no-caption controls
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "hse-quiet-cap-$env:GITHUB_RUN_ID"
          if (Test-Path $scratch) { throw 'scratch path already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            $models = Join-Path $scratch 'models'
            python -B tools/prepare_models.py --languages ko,en,zh --out $models *> $null
            if ($LASTEXITCODE -ne 0) { throw 'verified OCR models unavailable' }
            python -B tools/compare_quiet_segment_caps.py --model-dir $models --caps none,0.625,0.75 --blank-controls
            if ($LASTEXITCODE -ne 0) { throw 'bounded real-model quiet cap study incomplete' }
          }
          finally {
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove isolated Windows runtime
        if: ${{ always() }}
        shell: pwsh
        run: |
          Remove-Item .venv-hse-quiet-cap -Recurse -Force -ErrorAction SilentlyContinue
