name: HSE Kosys audio-TimedText correlation — rejected as visual ground truth

on:
  push:
    branches:
      - research/rapidvideocr-explicit-path-args-20261107

permissions:
  contents: read

concurrency:
  group: hse-natural-ja-timedtext-${{ github.sha }}
  cancel-in-progress: false

jobs:
  natural-ja-timedtext:
    if: ${{ contains(github.event.head_commit.message, '[hse-kosys-reference-scope-audit]') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare only pinned free local OCR and FFmpeg
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Windows x64 natural-video acceptance only'
          }
          $root=Join-Path $env:RUNNER_TEMP ("hse-kosys-ja-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'owned scratch collision' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "HSE_KOSYS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $venv=Join-Path $root 'venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'isolated Python setup failed' }
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check -e ".[ocr]" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'free local OCR dependencies unavailable' }
          $bin=Join-Path $root 'bin'
          pwsh -NoProfile -File tools/prepare_ffmpeg_ci.ps1 -Destination $bin
          if ($LASTEXITCODE -ne 0) { throw 'pinned FFmpeg unavailable' }
          $models=Join-Path $root 'models'
          & $py -B tools/prepare_models.py --languages zh --out $models *> $null
          if ($LASTEXITCODE -ne 0) { throw 'pinned JA/CJK OCR model unavailable' }
          "HSE_KOSYS_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HSE_KOSYS_MODELS=$models" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HSE_FFMPEG=$(Join-Path $bin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HSE_FFPROBE=$(Join-Path $bin 'ffprobe.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Historical-only audio transcript correlation; never visual OCR ground truth
        shell: pwsh
        env:
          PYTHONPATH: "src;tools"
          PYTHONDONTWRITEBYTECODE: "1"
          HSE_KOSYS_ROI_STUDY: ${{ contains(github.event.head_commit.message, '[hse-kosys-roi]') }}
          HSE_KOSYS_MIDPOINT_STUDY: ${{ contains(github.event.head_commit.message, '[hse-kosys-midpoint]') }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:HSE_KOSYS_MIDPOINT_STUDY -eq 'true') {
            & $env:HSE_KOSYS_PY -B tools/diagnose_kosys_midpoint_ocr.py --scratch (Join-Path $env:HSE_KOSYS_ROOT 'media') --model-dir $env:HSE_KOSYS_MODELS --approve-cc-source-download
            if ($LASTEXITCODE -ne 0) { throw 'natural Japanese midpoint OCR diagnosis incomplete; no retry' }
            return
          }
          if ($env:HSE_KOSYS_ROI_STUDY -eq 'true') {
            & $env:HSE_KOSYS_PY -B tools/compare_kosys_natural_ja_roi.py --scratch (Join-Path $env:HSE_KOSYS_ROOT 'media') --model-dir $env:HSE_KOSYS_MODELS --approve-cc-source-download
            if ($LASTEXITCODE -ne 0) { throw 'natural Japanese ROI diagnosis incomplete; no retry' }
            return
          }
          & $env:HSE_KOSYS_PY -B tools/verify_kosys_natural_ja_groundtruth.py --scratch (Join-Path $env:HSE_KOSYS_ROOT 'media') --model-dir $env:HSE_KOSYS_MODELS --approve-cc-source-download
          if ($LASTEXITCODE -ne 0) {
            throw 'natural Japanese independent-reference QA incomplete; no retry'
          }
      - name: Remove only this run's temporary public media and models
        if: always()
        shell: pwsh
        run: |
          $expected=Join-Path $env:RUNNER_TEMP ("hse-kosys-ja-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if ($env:HSE_KOSYS_ROOT -and [string]::Equals(
              $env:HSE_KOSYS_ROOT,$expected,[System.StringComparison]::OrdinalIgnoreCase
          ) -and (Test-Path -LiteralPath $expected)) {
            Remove-Item -LiteralPath $expected -Recurse -Force -ErrorAction SilentlyContinue
          }
