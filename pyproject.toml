[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-subtitle-extractor"
version = "0.1.0"
description = "Standalone Korean hard-subtitle extractor with selective OCR and SRT/ASS output"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "Pillow>=10.0",
  "playwright==1.64.1",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.10.0", "onnxruntime==1.31.1"]
accelerated = ["openvino==2026.4.1"]

[project.scripts]
hard-sub-extract = "hardsub_extractor.cli:main"
hard-sub-extractor-gui = "hardsub_extractor.gui_entry:main"
hard-sub-selftest = "hardsub_extractor.selftest:main"

[tool.setuptools.packages.find]
where = ["src"]
